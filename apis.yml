aid: andpad
name: ANDPAD
description: >-
  ANDPAD (株式会社アンドパッド / ANDPAD Inc.) is Japan's leading cloud construction-management
  and construction-DX platform, used by more than 260,000 companies and hundreds of thousands
  of field and office users across new-build housing, renovation, specialty trades, general
  contracting, and facilities management. The platform spans scheduling, photo and document
  management, drawings, inspection checklists, chat, billing, and procurement, and exposes an
  external REST API (api.andpad.jp) plus an app marketplace (ANDPAD App Market) so partners can
  integrate their own services with ANDPAD. ANDPAD is backed by Hongshan (HongShan / Sequoia
  China) and operates a public developer site, a system status page, and a published
  security.txt disclosure channel.
