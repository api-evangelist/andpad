    ANDPAD's external REST API for integrating partner services with the ANDPAD construction
    management platform via the ANDPAD App Market. Served from api.andpad.jp with a versioned
    /v1 base path, JSON responses, and OAuth-based partner authorization. Responses use a
    {"data": {...}} envelope and carry an x-request-id header for tracing.
